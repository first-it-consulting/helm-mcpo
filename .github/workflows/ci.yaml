name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: azure/setup-helm@v4
        with:
          version: v3.16.3

      - name: Build dependencies from lock
        run: helm dependency build .

      - name: Lint chart
        run: helm lint .

      - name: Template with default values
        run: helm template smoke-release .

      - name: Template with values.yaml
        run: helm template smoke-release . -f values.yaml
